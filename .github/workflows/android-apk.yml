name: Android-APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests der Web-App
        run: npm test

      - name: Web-Dateien in die App kopieren
        run: |
          WWW=android/app/src/main/assets/www
          rm -rf "$WWW"
          mkdir -p "$WWW/sounds"
          cp Morgenlicht.html morgenlicht.css morgenlicht.js morgenlicht-zeit.js morgenlicht-klang.js \
             morgenlicht-sw.js morgenlicht.webmanifest morgenlicht-icon.svg \
             morgenlicht-180.png morgenlicht-192.png morgenlicht-512.png "$WWW/"
          cp sounds/*.wav sounds/QUELLEN.md "$WWW/sounds/"
          ls -R "$WWW"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: APK bauen
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: APK als Release bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
          NUMMER: ${{ github.run_number }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Morgenlicht.apk
          gh release create "apk-1.0.$NUMMER" Morgenlicht.apk \
            --target "$GITHUB_SHA" \
            --title "Morgenlicht 1.0.$NUMMER (Android)" \
            --latest \
            --notes "Android-App-Hülle für Morgenlicht. Auf dem Handy Morgenlicht.apk herunterladen und öffnen; beim ersten Mal die Installation aus dieser Quelle erlauben. Der Wecker klingelt nur, solange die App geöffnet ist (Ladekabel anschließen)."
