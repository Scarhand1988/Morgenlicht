name: Android-APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests der Web-App
        run: npm test

      - name: Web-Dateien in die App kopieren
        run: |
          WWW=android/app/src/main/assets/www
          rm -rf "$WWW"
          mkdir -p "$WWW/sounds"
          cp Morgenlicht.html morgenlicht.css morgenlicht.js morgenlicht-zeit.js morgenlicht-klang.js morgenlicht-i18n.js \
             morgenlicht-sw.js morgenlicht.webmanifest morgenlicht-icon.svg \
             morgenlicht-180.png morgenlicht-192.png morgenlicht-512.png "$WWW/"
          cp sounds/*.wav sounds/QUELLEN.md "$WWW/sounds/"
          ls -R "$WWW"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Eigenen Signaturschlüssel einrichten (falls als Geheimnis hinterlegt)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Eigener Schlüssel wird verwendet."
          else
            echo "Kein eigenes Geheimnis gefunden, es wird der Schlüssel aus dem Repo verwendet."
          fi

      - name: APK bauen
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: APK als Release bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
          NUMMER: ${{ github.run_number }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk SunriseClock.apk
          gh release create "apk-1.0.$NUMMER" SunriseClock.apk \
            --target "$GITHUB_SHA" \
            --title "Sunrise Clock 1.0.$NUMMER (Android)" \
            --latest \
            --notes "Sunrise Clock for Android. Download SunriseClock.apk on your phone and open it; allow installation from this source the first time. Sunrise Clock für Android: SunriseClock.apk auf dem Handy herunterladen und öffnen, beim ersten Mal die Installation aus dieser Quelle erlauben."
